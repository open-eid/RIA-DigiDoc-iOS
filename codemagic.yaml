scripts:
  - &get_app_version
    name: "Get RIA DigiDoc version"
    script: |
      echo APP_VERSION=$(xcodebuild -project $CM_BUILD_DIR/RIADigiDoc.xcodeproj -showBuildSettings | grep MARKETING_VERSION | tr -d 'MARKETING_VERSION =') >> $CM_ENV
  - &get_google_services_plist
    name: "Get Google Services configuration"
    script: |
      echo $GOOGLE_SERVICES_PLIST | base64 --decode > "$CM_BUILD_DIR/RIADigiDoc/Supporting files/GoogleService-Info.plist"

workflows:
  debug:
    name: RIA DigiDoc debug
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic MOPP
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ee.ria.digidoc
      groups:
        - "google_services"
        - "repo_ria"
      vars:
        BUNDLE_ID: "ee.ria.digidoc"
        XCODE_SCHEME: "RIADigiDoc"
        APP_STORE_APP_ID: 1216104448
        APP_STORE_APPLE_ID: ET847QJV9F
        RESOURCES_DIRECTORY: "Modules/ConfigLib/Sources/ConfigLib/Resources"
      xcode: latest
    inputs:
      defaultCentralConfigurationUrl_input:
        description: Default Central Configuration URL
        type: choice
        default: http://ria.test/config/mobile
        options:
          - http://ria.test/config/mobile
          - https://id.eesti.ee
          - https://id-test.eesti.ee
          - https://id.test.eesti.ee
      defaultCentralConfigurationUpdateInterval_input:
        description: Default Central Configuration Update Interval
        type: number
        default: 4
      defaultCentralConfigurationTslUrl_input:
        description: Default Central Configuration TSL URL
        type: choice
        default: http://ria.test/tsl/trusted-test-mp.xml
        options:
          - http://ria.test/tsl/trusted-test-mp.xml
          - https://ec.europa.eu/tools/lotl/eu-lotl.xml
          - https://open-eid.github.io/test-TL/tl-mp-test-EE.xml
      memberTsl_input:
        description: TSL member lists
        type: string
        default: "EE;EE_T"
      enableTests_input:
        description: Run tests?
        type: boolean
        default: false
    scripts:
      - name: Parameters
        script: |
          echo Default Central Configuration URL: ${{ inputs.defaultCentralConfigurationUrl_input }}
          echo Default Central Configuration Update Interval: ${{ inputs.defaultCentralConfigurationUpdateInterval_input }}
          echo Default Central Configuration TSL URL: ${{ inputs.defaultCentralConfigurationTslUrl_input }}
          echo "TSL member lists: ${{ inputs.memberTsl_input }}"
          echo Run tests?: ${{ inputs.enableTests_input }}
      - name: Setup dependencies
        script: |
          brew install mockolo
      - *get_google_services_plist
      - name: "Setup config and TSL files"
        script: |
          set -e -o pipefail

          TSL_URL='${{ inputs.defaultCentralConfigurationTslUrl_input }}'
          MEMBER_TSLS='${{ inputs.memberTsl_input }}'

          export CONFIG_DIRECTORY="$RESOURCES_DIRECTORY/config"
          export TSL_FILES_DIRECTORY="$RESOURCES_DIRECTORY/tslFiles"
          export TSL_BASE_DIRECTORY="$CM_BUILD_DIR/tslBaseFiles"
          export CONFIGURED_TSL="$(basename "$TSL_URL")"

          # Create config, TSL folders and mock folders for each module
          mkdir -p $CONFIG_DIRECTORY
          mkdir -p $TSL_FILES_DIRECTORY
          mkdir -p $TSL_BASE_DIRECTORY

          # SPM packages must exist and need at least 1 file. Mock files are generated in 'Run tests' step
          for module in CommonsLib ConfigLib WebEidLib CryptoLib IdCardLib LibdigidocLib MobileIdLib SmartIdLib UtilsLib; do
            mock_dir="Modules/${module}/Tests/Mocks/Generated"
            mkdir -p "$mock_dir"
            echo "// Placeholder for generated mocks" > "${mock_dir}/__placeholder.swift"
          done

          # Remove current files in tslFiles.bundle
          echo "Removing current TSL files"
          find $TSL_FILES_DIRECTORY -mindepth 1 ! -name ".keep" -delete

          # Download latest 'eu-lotl.xml' file"
          echo "Downloading latest 'eu-lotl.xml' file"
          wget -q "https://ec.europa.eu/tools/lotl/eu-lotl.xml" -O "$TSL_BASE_DIRECTORY/eu-lotl.xml"

          # Get repo.ria values from environmental variables, as CodeMagic doesn't have access to repo.ria domain
          if [[ "$TSL_URL" == *"ria.test"* ]]; then
            echo "Using repo.ria configuration"
            echo $REPO_RIA_DEFAULT_PROPERTIES | base64 --decode > $CONFIG_DIRECTORY/configuration.properties
            echo $REPO_RIA_CONFIG | base64 --decode > $CONFIG_DIRECTORY/default-config.json
            echo $REPO_RIA_PUB_KEY | base64 --decode > $CONFIG_DIRECTORY/default-config.ecpub
            echo $REPO_RIA_ECC | base64 --decode > $CONFIG_DIRECTORY/default-config.ecc
            echo $REPO_RIA_TRUSTED_TEST_MP | base64 --decode > "$TSL_BASE_DIRECTORY/trusted-test-mp.xml"

            for configFile in "$CONFIG_DIRECTORY/configuration.properties" "$CONFIG_DIRECTORY/default-config.json" \
              "$CONFIG_DIRECTORY/default-config.ecpub" "$CONFIG_DIRECTORY/default-config.ecc" \
              "$TSL_BASE_DIRECTORY/trusted-test-mp.xml"; do
              if [ ! -s "$configFile" ]; then
                echo "ERROR: $configFile is missing or empty"
                exit 1
              fi
            done
          else
            echo "Not using repo.ria configuration"

            if [ ! -f "$TSL_BASE_DIRECTORY/$CONFIGURED_TSL" ]; then
              echo "Downloading '$CONFIGURED_TSL' file"
              wget -q "$TSL_URL" -O "$TSL_BASE_DIRECTORY/$CONFIGURED_TSL"
            fi
          fi

          echo "Writing requested test member TSLs from environment variables"
          MEMBERS_TO_DOWNLOAD=""
          for member in $(echo "$MEMBER_TSLS" | tr ';' ' '); do
            if [[ ! "$member" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "Invalid TSL member code: '$member'"
              exit 1
            fi

            if [[ "$member" != *_T ]]; then
              echo "Member '$member' is downloaded from a base file"
              MEMBERS_TO_DOWNLOAD="$MEMBERS_TO_DOWNLOAD;$member"
              continue
            fi

            variable_name="REPO_RIA_${member}_TSL"
            variable_value="$(printenv "$variable_name" || true)"

            if [ -z "$variable_value" ]; then
              echo "Test member '$member' was requested but $variable_name is not set"
              exit 1
            fi

            echo "Writing $member.xml from $variable_name"
            member_file="$TSL_FILES_DIRECTORY/$member.xml"
            printf '%s' "$variable_value" | base64 --decode > "$member_file.raw"
            if gzip -t "$member_file.raw" 2> /dev/null; then
              gunzip -c "$member_file.raw" > "$member_file"
            else
              cp "$member_file.raw" "$member_file"
            fi
            rm -f "$member_file.raw"

            if [ ! -s "$member_file" ]; then
              echo "ERROR: $member_file is missing or empty"
              exit 1
            fi
          done
          MEMBERS_TO_DOWNLOAD="${MEMBERS_TO_DOWNLOAD#;}"

          echo "Getting TSL"
          python3 scripts/tsl_xml_downloader.py \
            --tslFile="$TSL_BASE_DIRECTORY/eu-lotl.xml" \
            --tslFile="$TSL_BASE_DIRECTORY/trusted-test-mp.xml" \
            --members="$MEMBERS_TO_DOWNLOAD"
          echo "Finished downloading TSL"

          if [ -n "$(ls -A scripts/TSL 2> /dev/null)" ]; then
            echo "Moving TSLs to app's TSL files directory"
            mv -v scripts/TSL/* $TSL_FILES_DIRECTORY
            echo "Done moving TSLs"
          else
            echo "No downloaded TSLs to move"
          fi

          if [[ "$TSL_URL" == *"ria.test"* ]]; then
            echo "Adding repo.ria TSL to app's TSL files directory"
            cp -v "$TSL_BASE_DIRECTORY/trusted-test-mp.xml" "$TSL_FILES_DIRECTORY/"
          else
            echo "Adding eu-lotl.xml to app's TSL files directory"
            cp -v "$TSL_BASE_DIRECTORY/eu-lotl.xml" "$TSL_FILES_DIRECTORY/"

            if [ "$CONFIGURED_TSL" != "eu-lotl.xml" ]; then
              echo "Adding $CONFIGURED_TSL to app's TSL files directory"
              cp -v "$TSL_BASE_DIRECTORY/$CONFIGURED_TSL" "$TSL_FILES_DIRECTORY/"
            fi
          fi

          echo "TSL files bundled in resources: $(ls "$TSL_FILES_DIRECTORY" | tr '\n' ' ')"
      - *get_app_version
      - name: Fetch default configuration
        script: |
          # Not running 'SetupConfiguration' for repo.ria as necessary files are already setup
          if [[ ! "${{ inputs.defaultCentralConfigurationTslUrl_input }}" == *"ria.test"* ]]; then
            echo "Fetching default configuration"
            python3 scripts/setup_configuration.py ${{ inputs.defaultCentralConfigurationUrl_input }} ${{ inputs.defaultCentralConfigurationUpdateInterval_input }} ${{ inputs.defaultCentralConfigurationTslUrl_input }}
          else
            echo "Skipping default configuration fetching for repo.ria"
          fi
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Run tests
        script: |
          sh scripts/generate-mocks.sh
          
          sh scripts/run-ci-tests.sh
        when:
          condition: ${{ inputs.enableTests_input }}
      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number $APP_STORE_APP_ID)
          LATEST_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "LATEST_BUILD_NUMBER=$LATEST_BUILD_NUMBER" >> $CM_ENV
          agvtool new-version -all "$LATEST_BUILD_NUMBER"
      - name: Build RIA DigiDoc
        script: |          
          # Skip fetching configuration for repo.ria as necessary files are already setup
          REPO_RIA_CONF_FLAGS=""
          if [[ "${{ inputs.defaultCentralConfigurationTslUrl_input }}" == *"ria.test"* ]]; then
            REPO_RIA_CONF_FLAGS="DEFAULT_CENTRAL_CONFIGURATION_URL='' DEFAULT_CENTRAL_CONFIGURATION_UPDATE_INTERVAL=4 DEFAULT_CENTRAL_CONFIGURATION_TSL_URL=''"
          fi
          
          # Enable logging flag
          LOGGING_FLAGS="OTHER_SWIFT_FLAGS=\"\$(inherited) -DENABLE_LOGGING\""
          
          # Add logging flag to conf flags
          ARCHIVE_FLAGS="$REPO_RIA_CONF_FLAGS $LOGGING_FLAGS -skipPackagePluginValidation"

          xcode-project build-ipa \
            --clean \
            --project "$CM_BUILD_DIR/RIADigiDoc.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "$ARCHIVE_FLAGS"
      - name: Rename and move IPA
        script: |
          mv -v build/ios/ipa/RIADigiDoc.ipa build/ios/ipa/"RIA_DigiDoc_dev_$APP_VERSION.$LATEST_BUILD_NUMBER.ipa"
      - name: Generate release notes for TestFlight
        script: |
          cat <<EOF > release_notes.json
          [
            {
              "language": "en-GB",
              "text": "Branch: $CM_BRANCH \\nMode: dev"
            },
            {
              "language": "en-US",
              "text": "Branch: $CM_BRANCH \\nMode: dev"
            }
          ]
          EOF
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - marten.rebane@nortal.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  release:
    name: RIA DigiDoc release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic MOPP
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ee.ria.digidoc
      groups:
        - "google_services"
      vars:
        BUNDLE_ID: "ee.ria.digidoc"
        XCODE_SCHEME: "RIADigiDoc"
        APP_STORE_APP_ID: 1216104448
        APP_STORE_APPLE_ID: ET847QJV9F
        RESOURCES_DIRECTORY: "Modules/ConfigLib/Sources/ConfigLib/Resources"
      xcode: latest
    scripts:
      - name: Setup dependencies
        script: |
          brew install mockolo
      - *get_google_services_plist
      - name: "Setup config and TSL files"
        script: |
          set -e -o pipefail

          export CONFIG_DIRECTORY="$RESOURCES_DIRECTORY/config"
          export TSL_FILES_DIRECTORY="$CONFIG_DIRECTORY/tslFiles.bundle"

          # Create TSL folder and mock folders for each module
          mkdir -p $TSL_FILES_DIRECTORY
          
          # SPM packages must exist and need at least 1 file. Mock files are generated in 'Run tests' step
          for module in CommonsLib ConfigLib WebEidLib CryptoLib IdCardLib LibdigidocLib MobileIdLib SmartIdLib UtilsLib; do
            mock_dir="Modules/${module}/Tests/Mocks/Generated"
            mkdir -p "$mock_dir"
            echo "// Placeholder for generated mocks" > "${mock_dir}/__placeholder.swift"
          done

          # Remove current files in tslFiles.bundle
          echo "Removing current TSL files"
          find $TSL_FILES_DIRECTORY -mindepth 1 ! -name ".keep" -delete

          # Download latest 'eu-lotl.xml' file"
          echo "Downloading latest 'eu-lotl.xml' file"
          wget -q "https://ec.europa.eu/tools/lotl/eu-lotl.xml" -O "$TSL_FILES_DIRECTORY/eu-lotl.xml"
          
          echo "Getting TSL"
          python3 scripts/tsl_xml_downloader.py \
            --tslFile="$TSL_FILES_DIRECTORY/eu-lotl.xml" \
            --members="EE"
          echo "Finished downloading TSL"

          echo "Moving TSLs to app's TSL files directory"
          mv -v scripts/TSL/* $TSL_FILES_DIRECTORY
          echo "Done moving TSLs"

          echo "TSL files bundled in resources: $(ls "$TSL_FILES_DIRECTORY" | tr '\n' ' ')"
      - name: Fetch default configuration
        script: |
          echo "Fetching default configuration"
          python3 scripts/setup_configuration.py "https://id.eesti.ee" 4 "https://ec.europa.eu/tools/lotl/eu-lotl.xml"
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Run tests
        script: |
          sh scripts/generate-mocks.sh

          sh scripts/run-ci-tests.sh
      - *get_app_version
      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number $APP_STORE_APP_ID)
          LATEST_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "LATEST_BUILD_NUMBER=$LATEST_BUILD_NUMBER" >> $CM_ENV
          agvtool new-version -all "$LATEST_BUILD_NUMBER"
      - name: Build RIA DigiDoc
        script: |
          xcode-project build-ipa \
            --clean \
            --project "$CM_BUILD_DIR/RIADigiDoc.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs="-skipPackagePluginValidation" \
            --log-stream stdout \
            -v
      - name: Rename and move IPA
        script: |
          mv -v build/ios/ipa/RIADigiDoc.ipa build/ios/ipa/"RIA_DigiDoc_release_$APP_VERSION.$LATEST_BUILD_NUMBER.ipa"
      - name: Generate release notes for TestFlight
        script: |
          cat <<EOF > release_notes.json
          [
            {
              "language": "en-GB",
              "text": "Branch: $CM_BRANCH \\nMode: release \\nApp: MOPP3"
            },
            {
              "language": "en-US",
              "text": "Branch: $CM_BRANCH \\nMode: release \\nApp: MOPP3"
            }
          ]
          EOF
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - marten.rebane@nortal.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false

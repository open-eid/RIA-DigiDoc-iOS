name: CodeQL
on:
  push:
    branches:
      - main
      - code-ql-fix # TEMP: remove before merging
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # Weekly

jobs:
  swift:
    name: CodeQL (swift, c-cpp)
    if: contains(github.repository, 'open-eid/RIA-DigiDoc-iOS')
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    concurrency:
      group: codeql-swift-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      matrix:
        xcode:
          - 26.6
        platform:
          - iOS
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up build environment
      uses: ./.github/actions/setup-build-env
      with:
        xcode: ${{ matrix.xcode }}
        google-services-plist: ${{ secrets.GOOGLE_SERVICES_PLIST }}
    - name: Resolve package dependencies
      run: |
        cd ${{ github.workspace }}

        rm -rf ~/Library/Developer/Xcode/DerivedData/*
        rm -rf ${{ github.workspace }}/build
        rm -rf ${{ github.workspace }}/.build

        xcodebuild -resolvePackageDependencies -project RIADigiDoc.xcodeproj
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: swift,c-cpp
        build-mode: manual
    - name: Build
      run: |
        cd ${{ github.workspace }}

        xcodebuild build \
          -project RIADigiDoc.xcodeproj \
          -skipPackagePluginValidation \
          -scheme RIADigiDoc \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -derivedDataPath "${{ github.workspace }}/build" \
          COMPILATION_CACHE_ENABLE_CACHING=NO \
          SWIFT_ENABLE_COMPILE_CACHE=NO \
          SWIFT_USE_INTEGRATED_DRIVER=NO \
          -quiet
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
    - name: Clean up
      if: ${{ always() }}
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData/*
        rm -rf ${{ github.workspace }}/build
        rm -rf ${{ github.workspace }}/.build

  scripts:
    name: CodeQL (${{ matrix.language }})
    if: contains(github.repository, 'open-eid/RIA-DigiDoc-iOS')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    concurrency:
      group: codeql-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
